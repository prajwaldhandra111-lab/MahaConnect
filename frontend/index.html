<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MahaConnect | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                MC
            </div>

            <h1>MahaConnect</h1>

            <p class="subtitle">
                One Profile. Multiple Government Services.
            </p>

            <form id="loginForm">

                <label for="mobile">Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="message"></p>

            </form>

            <p class="demo-text">
                Demo Login
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
